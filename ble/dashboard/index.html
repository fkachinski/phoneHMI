<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rexroth | Instruments</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #080e17; color: #edf4ff; }
    * { box-sizing: border-box; }
    body { margin: 0 auto; padding: 24px 18px 32px; max-width: 800px; background: radial-gradient(ellipse at 50% 20%, #17273a, #080e17 70%); min-height: 100vh; }
    .logo-panel { display:flex; align-items:center; background:#fff; border-top:4px solid #e2231a; border-radius:10px; padding:14px 18px; margin-bottom:18px; }
    .logo-panel img { width:150px; height:61px; object-fit:contain; }
    .eyebrow { color:#91a6be; font-size:10px; letter-spacing:2px; text-transform:uppercase; }
    .toolbar { display:flex; align-items:center; gap:10px; margin:18px 0 0; flex-wrap:wrap; }
    #status { font-size:10px; letter-spacing:1px; color:#ffc66c; }
    body[data-live="true"] #status { color:#80c8ff; }
    button { font:600 12px system-ui; padding:10px 12px; border:1px solid #33475d; border-radius:7px; background:#1b2c40; color:#edf4ff; cursor:pointer; }
    #connect { color:#fff; background:#005691; border-color:#398ac3; }
    button:disabled { opacity:.4; cursor:default; }
    button:focus-visible { outline:3px solid #fff; outline-offset:3px; }
    .card { border:1px solid #2a3a4d; border-radius:18px; background:linear-gradient(145deg,#172434,#0d1622); box-shadow:0 12px 40px #0004; padding:20px; }
    .dial { position:relative; max-width:430px; margin:0 auto; }
    svg { display:block; width:100%; overflow:visible; }
    .track { fill:none; stroke:#25364a; stroke-width:16; stroke-linecap:round; }
    .arc { fill:none; stroke:#58b5ff; stroke-width:16; stroke-linecap:round; stroke-dasharray:0 100; transition:stroke-dasharray .7s ease; filter:drop-shadow(0 0 5px #00569180); }
    .dialvalue { position:absolute; top:48%; left:0; right:0; text-align:center; }
    #rpm { font-size:clamp(48px,12vw,76px); line-height:1; font-weight:700; letter-spacing:-4px; font-variant-numeric:tabular-nums; }
    .unit { font-size:11px; letter-spacing:3px; color:#91a6be; margin-top:8px; }
    svg text { fill:#91a6be; font:11px system-ui; }
    .subcards { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
    .reading { font-size:32px; font-weight:650; letter-spacing:-1px; margin:18px 0 12px; font-variant-numeric:tabular-nums; }
    .reading small { font-size:13px; font-weight:400; color:#91a6be; letter-spacing:0; }
    .bar { background:#25364a; border-radius:4px; height:5px; overflow:hidden; }
    .bar i { display:block; width:0; height:100%; background:#63abff; transition:width .7s ease; }
    #pressurebar { background:#ed2538; }
    .range { display:flex; justify-content:space-between; color:#91a6be; font-size:10px; margin-top:9px; }
    #detail { color:#a3b5ca; font-size:12px; line-height:1.6; }
    body[data-live="true"] #detail { display:none; }
    .simulation-label { color:#91a6be; font-size:10px; margin:14px 0 0; }
    body:not([data-live="true"]) .instruments { opacity:.55; }
    @media (max-width:370px) { .card { padding:14px; } }
    @media (prefers-reduced-motion:reduce) { .arc,.bar i { transition:none; } }
  </style>
</head>
<body>
  <div class="logo-panel">
    <img src="./rexroth-logo.gif" alt="Bosch Rexroth" width="300" height="122">
  </div>
  <main class="instruments" aria-label="Simulated instrument readings">
    <section class="card">
      <div class="eyebrow">Engine speed</div>
      <div class="dial">
        <svg viewBox="0 0 340 275" aria-hidden="true">
          <path class="track" d="M 57 228 A 140 140 0 1 1 283 228"/>
          <path id="rpmarc" class="arc" pathLength="100" d="M 57 228 A 140 140 0 1 1 283 228"/>
          <path fill="none" stroke="#ed2538" stroke-width="4" d="M 308 110 A 140 140 0 0 1 283 228"/>
          <text x="44" y="255">0</text><text x="54" y="112">750</text><text x="154" y="40">1500</text>
          <text x="253" y="112">2250</text><text x="269" y="255">3000</text>
        </svg>
        <div class="dialvalue"><div id="rpm" aria-label="Simulated engine RPM">--</div><div class="unit">RPM</div></div>
      </div>
    </section>
    <div class="subcards">
      <section class="card"><div class="eyebrow">Coolant temp</div>
        <div class="reading"><span id="temperature">--</span> <small>&deg;C</small></div>
        <div class="bar"><i id="tempbar"></i></div><div class="range"><span>0 &deg;C</span><span>120 &deg;C</span></div>
      </section>
      <section class="card"><div class="eyebrow">Hydraulic pressure</div>
        <div class="reading"><span id="pressure">--</span> <small>bar</small></div>
        <div class="bar"><i id="pressurebar"></i></div><div class="range"><span>0 bar</span><span>250 bar</span></div>
      </section>
    </div>
  </main>
  <div class="toolbar">
    <button id="connect">Connect</button><button id="disconnect" disabled>Disconnect</button>
    <span id="status" role="status">DISCONNECTED</span>
  </div>
  <p id="detail" role="status">Select Connect to choose a device.</p>
  <p class="simulation-label">Simulated data</p>
  <script>
    const serviceId = "7f4a0001-6f9c-47ac-9f65-1c4db9870021";
    const characteristicId = "7f4a0002-6f9c-47ac-9f65-1c4db9870021";
    const connect = document.getElementById("connect");
    const disconnect = document.getElementById("disconnect");
    const status = document.getElementById("status");
    const detail = document.getElementById("detail");
    let device = null;
    let characteristic = null;
    let previous = null;
    let lastAdvance = 0;
    let lastReceived = 0;
    let active = false;
    let generation = 0;
    let connectionTimer = null;

    function connectionStage(message) {
      detail.textContent = message;
      clearTimeout(connectionTimer);
      connectionTimer = setTimeout(() => {
        endSession(`${message} Timed out after 12 seconds. Disconnect other BLE apps, then retry.`);
      }, 12000);
    }

    function renderInstruments(sample) {
      const phase = sample % 120 * Math.PI / 60;
      const rpm = Math.round(1800 + 350 * Math.sin(phase));
      const temperature = 72 + 6 * Math.sin(phase / 2);
      const pressure = 185 + 20 * Math.sin(phase + .8);
      document.getElementById("rpm").textContent = String(rpm);
      document.getElementById("temperature").textContent = temperature.toFixed(1);
      document.getElementById("pressure").textContent = pressure.toFixed(0);
      document.getElementById("rpmarc").style.strokeDasharray = `${rpm / 3000 * 100} 100`;
      document.getElementById("tempbar").style.width = `${temperature / 120 * 100}%`;
      document.getElementById("pressurebar").style.width = `${pressure / 250 * 100}%`;
    }

    function endSession(message) {
      clearTimeout(connectionTimer);
      generation++;
      active = false;
      if (characteristic) characteristic.removeEventListener("characteristicvaluechanged", receive);
      characteristic = null;
      if (device) {
        device.removeEventListener("gattserverdisconnected", disconnected);
        if (device.gatt.connected) device.gatt.disconnect();
      }
      device = null;
      connect.disabled = false;
      disconnect.disabled = true;
      previous = null;
      status.textContent = "DISCONNECTED";
      document.body.dataset.live = "false";
      detail.textContent = message;
    }

    function disconnected() {
      endSession("Bluetooth disconnected. Last value is not live. Tap Connect to reconnect.");
    }

    function receive(event) {
      try {
        const value = event.target.value;
        const text = new TextDecoder("utf-8", {fatal: true}).decode(value);
        const number = Number(text);
        if (!/^(0|[1-9][0-9]*)$/.test(text) || !Number.isSafeInteger(number)) {
          throw new Error("Invalid counter response");
        }
        const now = performance.now();
        if (previous === null || number !== previous) lastAdvance = now;
        previous = number;
        lastReceived = now;
        renderInstruments(number);
        refreshStatus();
      } catch (error) {
        endSession(`Last value is not live. ${error.message}. Tap Connect to retry.`);
      }
    }

    function refreshStatus() {
      if (!active || previous === null) return;
      const now = performance.now();
      const stale = now - lastAdvance >= 3000 || now - lastReceived >= 3000;
      status.textContent = stale ? "STALE" : "CONNECTED";
      document.body.dataset.live = String(!stale);
      detail.textContent = stale
        ? "No advancing counter received for 3 seconds. Last value is not live."
        : "Live simulated counter received over Bluetooth.";
    }

    connect.addEventListener("click", async () => {
      const attempt = ++generation;
      connect.disabled = true;
      status.textContent = "CONNECTING";
      detail.textContent = "Choose the laptop, then wait for the counter.";
      try {
        // Scan unfiltered because Windows may omit the service UUID in advertisements.
        const selected = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true, optionalServices: [serviceId]
        });
        if (attempt !== generation) return;
        device = selected;
        const selectedDevice = selected;
        disconnect.disabled = false;
        device.addEventListener("gattserverdisconnected", disconnected);
        connectionStage("Connecting to the selected Bluetooth device.");
        const server = await device.gatt.connect();
        if (attempt !== generation) {
          if (selectedDevice.gatt.connected) selectedDevice.gatt.disconnect();
          return;
        }
        connectionStage("Finding the simulated counter service.");
        const service = await server.getPrimaryService(serviceId);
        if (attempt !== generation) return;
        connectionStage("Finding the counter characteristic.");
        characteristic = await service.getCharacteristic(characteristicId);
        if (attempt !== generation) return;
        characteristic.addEventListener("characteristicvaluechanged", receive);
        connectionStage("Enabling Bluetooth counter notifications.");
        await characteristic.startNotifications();
        if (attempt !== generation) return;
        active = true;
        disconnect.disabled = false;
        connectionStage("Subscribed. Reading the first counter value.");
        const source = characteristic;
        const value = await source.readValue();
        if (attempt === generation) {
          clearTimeout(connectionTimer);
          receive({target: {value}});
        }
      } catch (error) {
        if (attempt === generation) {
          endSession(`Connection failed: ${error.message}. Tap Connect to retry.`);
        }
      }
    });
    disconnect.addEventListener("click", () => endSession("Disconnected by you. Last value is not live."));
    setInterval(refreshStatus, 250);
    if (!window.isSecureContext || !navigator.bluetooth) {
      connect.disabled = true;
      status.textContent = "UNSUPPORTED";
      detail.textContent = "Use an HTTPS page in Bluefy on iPhone/iPad or Chrome on Android. Safari cannot access this BLE counter.";
    }
  </script>
</body>
</html>
